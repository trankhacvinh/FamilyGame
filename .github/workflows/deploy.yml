name: Build and Deploy FamilyGame

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Keep only one Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t artifact_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts | map(select(.name == "github-pages")) | sort_by(.id) | reverse | .[].id'
          )

          echo "Found ${#artifact_ids[@]} github-pages artifact(s)."

          if (( ${#artifact_ids[@]} > 1 )); then
            echo "GitHub created duplicate Pages artifacts; keeping ${artifact_ids[0]} and deleting the rest."
            for artifact_id in "${artifact_ids[@]:1}"; do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            done
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
